name: moneyhub

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: moneyhub
      POSTGRES_USER: moneyhub
      POSTGRES_PASSWORD: moneyhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U moneyhub -d moneyhub]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_URL: http://localhost:8080
      DATABASE_URL: postgresql://moneyhub:moneyhub@db:5432/moneyhub?sslmode=disable
      DIRECT_URL: postgresql://moneyhub:moneyhub@db:5432/moneyhub?sslmode=disable
      FIREBASE_PROJECT_ID: demo-moneyhub
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_WEB_API_KEY: demo-api-key
      LLM_PROVIDER: mock
      RATE_LIMIT_MAX: "${MONEYHUB_RATE_LIMIT_MAX:-100}"
      RATE_LIMIT_WINDOW_MS: "${MONEYHUB_RATE_LIMIT_WINDOW_MS:-900000}"
      CI: "true"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9099:9099"
    volumes:
      - firebase_data:/data/firebase
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, /workspace/docker/healthcheck.mjs]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  firebase_data:
